name: Discover OddsPapi data shapes

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run discovery
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python -m engine.discover
      - name: Commit results
        run: |
          git config user.name "evens-bot"
          git config user.email "evens-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Discovery: OddsPapi reference data"
          git pull --rebase
          git push
