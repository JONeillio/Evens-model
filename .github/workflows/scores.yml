name: Live scores

# GitHub starts scheduled runs late on busy days (every 40-50 minutes rather
# than every 10), so each run keeps polling every 5 minutes for up to 50
# minutes while a tracked match is on. The next
# scheduled run picks up after that. Runs with nothing live exit in seconds.
# API-Football is asked at most every ~10 minutes (100 a day); football-data.org
# in between. Run by hand from the Actions tab: "Live scores" -> "Run workflow".
on:
  schedule:
    - cron: "*/10 11-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Its own group so a long poll never holds up the odds refresh (and vice versa).
concurrency:
  group: live-scores
  cancel-in-progress: false

jobs:
  scores:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Poll scores
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_API: ${{ secrets.FOOTBALL_DATA_API }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          git config user.name "evens-bot"
          git config user.email "evens-bot@users.noreply.github.com"
          end=$((SECONDS + 50 * 60))
          while :; do
            # Start each check from the latest main (the odds refresh may have pushed).
            git fetch -q origin main && git reset -q --hard origin/main
            python -m engine.scores $FORCE --status-file /tmp/scores_status.json || echo "scores check failed"
            FORCE=""
            git add data docs/data
            if ! git diff --cached --quiet; then
              git commit -q -m "Scores $(date -u +'%Y-%m-%d %H:%M') UTC"
              for i in 1 2 3; do
                if git pull -q --rebase origin main && git push -q origin HEAD:main; then break; fi
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
            fi
            keep=$(python -c "import json;s=json.load(open('/tmp/scores_status.json'));print(1 if s['live'] else 0)" 2>/dev/null || echo 0)
            if [ "$keep" != "1" ] || [ $((SECONDS + 300)) -gt $end ]; then break; fi
            sleep 300
          done
