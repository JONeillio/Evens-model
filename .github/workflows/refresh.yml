name: Refresh odds and slips

# Runs every morning. Saturdays get the biggest share of the free request budget.
# Times are UTC (07:15 UTC = 07:15 UK in winter, 08:15 in summer).
# Run it by hand from the Actions tab: "Refresh odds and slips" -> "Run workflow".
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "refresh (normal), probe (check which bookies have data, 1 request), sports (NFL/NBA discovery, ~9 requests) or rebuild (re-run the engine on the last odds snapshot, 0 requests)"
        default: refresh
        type: choice
        options: [refresh, probe, sports, datacheck, nflbacktest, rebuild]
      calls:
        description: "refresh only: spend up to this many requests (blank = the normal daily share)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Check the engine still works
        run: python -m pytest -q tests

      - name: Pull odds, price legs, build slips
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          CALLS: ${{ inputs.calls }}
        run: |
          if [ "${{ inputs.task }}" = "probe" ]; then python -m engine.probe;
          elif [ "${{ inputs.task }}" = "sports" ]; then python -m engine.probe_sports;
          elif [ "${{ inputs.task }}" = "datacheck" ]; then python -m engine.datacheck;
          elif [ "${{ inputs.task }}" = "nflbacktest" ]; then python -m engine.nfl.backtest;
          elif [ "${{ inputs.task }}" = "rebuild" ]; then python -m engine.run --reuse-snapshot;
          else python -m engine.run ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }} ${CALLS:+--calls "$CALLS"}; fi

      - name: Save results
        if: always()
        run: |
          git config user.name "evens-bot"
          git config user.email "evens-bot@users.noreply.github.com"
          git add data docs/data
          git reset -q data/cache || true
          git diff --cached --quiet && exit 0
          git commit -m "Odds refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
